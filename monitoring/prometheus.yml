global:
	scrape_interval: 15s
	evaluation_interval: 15s

scrape_configs:
	- job_name: "prometheus"
		static_configs:
			- targets: ["localhost:9090"]
      
	- job_name: "mlops-serve"
		metrics_path: "/metrics"
		static_configs:
			- targets: ["hugging-face-serve:8000"]
		relabel_configs:
			- source_labels: [__address__]
				target_label: instance
				replacement: "mlops-serve"

	- job_name: "jenkins"
		metrics_path: "/prometheus"
		static_configs:
			- targets: ["jenkins:8080"]
